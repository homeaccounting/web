name: Bug report
description: Something in the web interface behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Scrub screenshots** — account numbers, contact names and
        real balances should not appear. If this is a security vulnerability, close this
        and follow [SECURITY.md](https://github.com/homeaccounting/web/blob/master/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. The screen shows ...
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or recording
      description: Drag an image in. Scrub any real financial data first.
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Self-hosted (Docker)
        - Managed cloud
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142, Safari 18.2, Chrome 140
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not relevant
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this problem.
          required: true
        - label: Any screenshots or logs here are free of real financial data.
          required: true
