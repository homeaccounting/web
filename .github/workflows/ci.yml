name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .
      - run: pnpm exec vitest run
      - run: pnpm build

  build-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: (github.ref == 'refs/heads/master' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH_SLUG="${BRANCH//\//-}"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Determine image tags
        id: tags
        run: |
          OWNER="${{ github.repository_owner }}"
          SHA_TAG="ghcr.io/${OWNER}/web:${{ steps.meta.outputs.sha_short }}"
          BRANCH_TAG="ghcr.io/${OWNER}/web:${{ steps.meta.outputs.branch_slug }}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "tags=${SHA_TAG},${BRANCH_TAG},ghcr.io/${OWNER}/web:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG},${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_API_BASE_URL=
            APP_COMMIT_HASH=${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
